<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="noScribe Live: a real-time view of a noScribe transcription." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>noScribe Live</title>
    <script>
      // Apply the stored theme, Easy view and language before first paint, so nothing flashes.
      // Same keys and defaults as use-theme.ts, use-easy-view.ts and i18n/core.ts (dark, Easy off, detected language).
      (function () {
        var el = document.documentElement;
        try {
          var theme = localStorage.getItem("noscribe-live-theme") === "light" ? "light" : "dark";
          el.classList.toggle("dark", theme === "dark");
          el.dataset.theme = theme;
        } catch (e) {}
        try {
          if (localStorage.getItem("noscribe-live-easy") === "1") el.dataset.easy = "true";
        } catch (e) {}
        try {
          var saved = localStorage.getItem("noscribe-live-locale");
          var first = (navigator.languages && navigator.languages[0]) || navigator.language || "";
          var zh = saved === "zh-TW" || (saved !== "en" && /^zh/i.test(first));
          el.lang = zh ? "zh-Hant-TW" : "en";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
