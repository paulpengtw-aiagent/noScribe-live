<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="noScribe Live: a real-time view of a noScribe transcription." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>noScribe Live</title>
    <script>
      // Apply the stored theme before first paint (dark when nothing is stored).
      (function () {
        try {
          var theme = localStorage.getItem("noscribe-live-theme") === "light" ? "light" : "dark";
          var el = document.documentElement;
          el.classList.toggle("dark", theme === "dark");
          el.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
